# Vietnes pamatiestatījumi
url: "https://aizupe.lv"
title: Aizupes pamatskola
description: "Aizupes pamatskola Līvbērzes pagastā, Jelgavas novadā – jaunumi, stundu saraksts, ēdienkarte, dokumenti un informācija skolēniem un vecākiem."
lang: lv

# Ģenerē /sitemap.xml meklētājprogrammām (robots.txt norāda uz to).
# Lapas ar "sitemap: false" galvenē tajā netiek iekļautas.
plugins:
  - jekyll-sitemap

# Jekyll by default skips files whose names start with "_".
# These menu PDFs do, so they are listed here to get published.
include:
  - _dienkarte_1_4_klase.pdf
  - _dienkarte_5_9_klase.pdf
