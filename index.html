---
layout: default
section: home
css:
- home.css
scripts:
- home.js
---
<!-- Banner -->
<div id="banner-wrapper">
    <div class="container">
        <div id="banner">
            <h2>Cieņa • Atbildība • Drošība</h2>
        </div>
    </div>
</div>


<div id="main">
    <div class="container">
        <div class="row main-row">

            <!-- Left: Facebook feed ~75% -->
            <div class="col-9 col-12-medium">
                <section>
                    <h2>Jaunumi</h2>
                    <div id="fb-root"></div>
                    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/lv_LV/sdk.js#xfbml=1&version=v24.0"></script>
                    <div class="fb-stretch-wrap">
                        <div class="fb-stretch-inner">
                            <div class="fb-page"
                                data-href="https://www.facebook.com/aizupespamatskola?locale=lv_LV"
                                data-tabs="timeline"
                                data-width="500"
                                data-height="900"
                                data-small-header="false"
                                data-adapt-container-width="false"
                                data-hide-cover="false"
                                data-show-facepile="true">
                                <blockquote cite="https://www.facebook.com/aizupespamatskola?locale=lv_LV" class="fb-xfbml-parse-ignore">
                                    <a href="https://www.facebook.com/aizupespamatskola?locale=lv_LV">Aizupes pamatskola</a>
                                </blockquote>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right: Date + quick links ~25% -->
            <div class="col-3 col-12-medium">

                <!-- Date widget -->
                <div class="date-widget" aria-label="Šodienas datums">
                    <div class="dw-year"    id="dw-year"></div>
                    <div class="dw-day"     id="dw-day"></div>
                    <div class="dw-month"   id="dw-month"></div>
                    <div class="dw-weekday" id="dw-weekday"></div>
                </div>

                <!-- Quick links -->
                <div class="quick-links">
                    <h2>Noderīgas saites</h2>
                    <div class="quick-links-grid">

                        <a class="quick-link-btn" href="https://my.e-klase.lv" target="_blank" rel="noopener noreferrer" title="E-klase">
                            <img src="images/e-klase.png" alt="E-klase" />
                        </a>

                        <a class="quick-link-btn" href="https://www.izm.gov.lv" target="_blank" rel="noopener noreferrer" title="Izglītības un zinātnes ministrija">
                            <img src="images/IZM_logo.png" alt="IZM" />
                        </a>

                        <a class="quick-link-btn" href="https://www.jelgavasnovads.lv/lv/pasvaldiba/izglitiba" target="_blank" rel="noopener noreferrer" title="Jelgavas novada Izglītības pārvalde">
                            <img src="images/jn_logo_sauklis_lv_liels.jpg" alt="Jelgavas novads Izglītības pārvalde" />
                        </a>

                        <a class="quick-link-btn" href="https://www.viaa.gov.lv" target="_blank" rel="noopener noreferrer" title="Valsts izglītības attīstības aģentūra">
                            <img src="images/logo_v_lv_2_0.png" alt="VIAA" />
                        </a>

                        <a class="quick-link-btn" href="https://www.uzdevumi.lv" target="_blank" rel="noopener noreferrer" title="Uzdevumi.lv">
                            <img src="images/Uzdevumi.lv_logo.png" alt="Uzdevumi.lv" />
                        </a>

                        <a class="quick-link-btn" href="https://www.jelgavasnovads.lv" target="_blank" rel="noopener noreferrer" title="Jelgavas novads">
                            <img src="images/jn_logo_sauklis_lv_liels.jpg" alt="Jelgavas novads" />
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
