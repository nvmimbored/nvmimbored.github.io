<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}Aizupes pamatskola</title>
  {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/site.css">
  {% for stylesheet in page.css %}<link rel="stylesheet" href="assets/css/{{ stylesheet }}">
  {% endfor %}
</head>
<body>
  <a class="skip-link" href="#main-content">Pāriet uz galveno saturu</a>
  <div id="page-wrapper">
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="assets/js/navigation.js" defer></script>
  {% for script in page.scripts %}<script src="assets/js/{{ script }}" defer></script>
  {% endfor %}
</body>
</html>
